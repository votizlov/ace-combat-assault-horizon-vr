[vr]
; Launch Ace Combat VR.cmd requests stereo. F10 selects the virtual screen.
enabled=1
; 1 meter in headset tracking becomes this many game units. Calibrate in cockpit.
units_per_meter=1.0
; Live ACE_mWVP/View/Local samples use row-vector matrices without transposition.
transpose_wvp=0
; Reproject recognized mission UI into the aircraft camera frame in stereo.
spatial_hud=1
; 0: collimated/infinite HUD, appropriate for directional target markers.
; Positive meters: place ALL recognized UI on one aircraft-fixed plane.
; This also changes target-marker parallax; individual target range is not available yet.
hud_depth_meters=0
; Keep batched textured counter-panel UI in the lower-right corner head-relative.
; Normalized stock-screen boundaries: 0 left/top, 1 right/bottom.
; Untextured target squares remain aircraft-relative even inside this region.
head_panel_left=0.72
head_panel_top=0.72
; Full native-resolution snapshots; GPU completion polling and DONOTWAIT locks.
; 0 restores the blocking diagnostic path, still at native resolution.
deferred_capture=1
; Expand the profiled native main-camera side frustum to include both VR eyes.
; Affects visibility candidates only; native gameplay camera/HUD matrices remain.
head_aware_culling=1
; Reject behavioral rendering changes for binaries other than the analyzed SHA-256.
allow_unknown_exe=0
; D3D9 interception can capture only draws that pass through the wrapped device.
max_clone_pairs=96
; Fullscreen 2560x1440 exhausted 256 MiB before all eye targets were allocated.
max_clone_megabytes=512
; 0: observe actual projection. A positive value enables an explicit fallback HFOV.
; Use only after measuring stock horizontal FOV; an inaccurate value distorts stereo.
fallback_horizontal_fov_degrees=0
